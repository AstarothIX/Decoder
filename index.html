<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifreleme Araçları</title>
<script src="https://unpkg.com/openpgp@5.11.2/dist/openpgp.min.js"></script>
<script>
  // Fallback CDN in case unpkg is blocked/unreachable
  window.addEventListener('DOMContentLoaded', function() {
    if (typeof openpgp === 'undefined') {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/openpgp@5.11.2/dist/openpgp.min.js';
      s.onload = function() {
        var w = document.getElementById('libWarning');
        if (w) w.style.display = 'none';
      };
      s.onerror = function() {
        var w = document.getElementById('libWarning');
        if (w) w.textContent = 'Kütüphane hiçbir CDN üzerinden yüklenemedi. İnternet bağlantını kontrol et.';
      };
      document.head.appendChild(s);
    }
  });
</script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --border: #2a323d;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #4fd1c5;
    --accent-dim: #2c7a72;
    --danger: #f47067;
    --mono: 'SF Mono', 'Cascadia Code', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(ellipse at top, #131a24 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { margin-bottom: 32px; text-align: center; }
  header .lock {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1 { font-size: 24px; margin: 0 0 6px; font-weight: 600; }
  header p { color: var(--muted); font-size: 14px; margin: 0; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
  }
  textarea, input[type="password"], input[type="text"] {
    width: 100%;
    background: #0a0e14;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 12px;
    font-family: var(--mono);
    font-size: 13px;
    resize: vertical;
  }
  textarea:focus, input:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  #cipherInput { min-height: 160px; }
  .field { margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: #0a0e14;
    border-radius: 8px;
    padding: 4px;
    border: 1px solid var(--border);
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    border-radius: 6px;
    cursor: pointer;
    transition: all .15s;
  }
  .tab.active { background: var(--accent-dim); color: #fff; }
  .mode-section { display: none; }
  .mode-section.active { display: block; }

  .tool-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 24px;
    background: #0a0e14;
    border-radius: 10px;
    padding: 4px;
    border: 1px solid var(--border);
  }
  .tool-tab {
    flex: 1;
    text-align: center;
    padding: 12px 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    transition: all .15s;
  }
  .tool-tab.active { background: var(--accent-dim); color: #fff; }
  .tool-panel { display: none; }
  .tool-panel.active { display: block; }

  button {
    width: 100%;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
    color: #06120f;
    border: none;
    border-radius: 8px;
    padding: 13px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
  }
  button:hover { opacity: 0.92; }
  button:active { transform: scale(0.99); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  .result-box {
    display: none;
    white-space: pre-wrap;
    word-break: break-word;
    background: #0a0e14;
    border: 1px solid var(--accent-dim);
    border-radius: 8px;
    padding: 14px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.5;
    margin-top: 16px;
  }
  .error-box {
    display: none;
    background: rgba(244, 112, 103, 0.1);
    border: 1px solid var(--danger);
    color: var(--danger);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-top: 16px;
  }
  .status-line {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    color: var(--accent);
    border: 1px solid var(--accent-dim);
    border-radius: 20px;
    padding: 3px 10px;
    margin-top: 4px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 20px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="lock">◆ ŞİFRELİ ◆</div>
    <h1>Şifreleme Araçları</h1>
    <div id="libWarning" style="display:none; color:#f47067; font-size:12px; margin-top:8px;"></div>
  </header>

  <div class="tool-tabs">
    <div class="tool-tab active" data-tool="pgp">PGP Mesaj Çözücü</div>
    <div class="tool-tab" data-tool="b64vig">Base64 + Vigenère</div>
  </div>

  <div class="tool-panel active" id="tool-pgp">
  <div class="panel">
    <div class="field">
      <label for="cipherInput">Şifreli Mesaj (PGP MESSAGE bloğu veya sadece kod)</label>
      <textarea id="cipherInput" placeholder="-----BEGIN PGP MESSAGE-----&#10;...&#10;-----END PGP MESSAGE-----&#10;&#10;veya sadece base64 kod bloğu"></textarea>
    </div>

    <div class="tabs">
      <div class="tab active" data-mode="password">Parola ile (Symmetric)</div>
      <div class="tab" data-mode="key">Private Key ile</div>
    </div>

    <div class="mode-section active" id="mode-password">
      <div class="field">
        <label for="passInput">Parola</label>
        <input type="password" id="passInput" placeholder="Şifreleme parolası">
      </div>
    </div>

    <div class="mode-section" id="mode-key">
      <div class="field">
        <label for="privKeyInput">Private Key (PGP PRIVATE KEY BLOCK)</label>
        <textarea id="privKeyInput" placeholder="-----BEGIN PGP PRIVATE KEY BLOCK-----&#10;..." style="min-height: 100px;"></textarea>
      </div>
      <div class="field">
        <label for="keyPassInput">Key Parolası (varsa)</label>
        <input type="password" id="keyPassInput" placeholder="Boş bırakılabilir">
      </div>
    </div>

    <div class="field" style="margin-top: 4px;">
      <button id="decryptBtn">Çöz</button>
    </div>

    <div class="status-line" id="statusLine"></div>
    <div class="error-box" id="errorBox"></div>
    <div class="result-box" id="resultBox"></div>
  </div>

  <footer>
    Made by Laevatain
  </footer>
  </div>

  <div class="tool-panel" id="tool-b64vig">
  <div class="panel">
    <div class="tabs">
      <div class="tab vtab active" data-vmode="decode">Çöz (Base64 → Vigenère)</div>
      <div class="tab vtab" data-vmode="encode">Şifrele (Vigenère → Base64)</div>
    </div>

    <div class="field">
      <label id="vigInputLabel" for="vigInputText">Metin</label>
      <textarea id="vigInputText" placeholder="Metni buraya yaz veya yapıştır" style="min-height: 120px;"></textarea>
    </div>

    <div class="field">
      <label for="vigKeyInput">Anahtar Kelime</label>
      <input type="text" id="vigKeyInput" placeholder="Şifreleme parolası">
    </div>

    <div class="field" style="margin-top: 4px;">
      <button id="vigRunBtn">Çalıştır</button>
    </div>

    <div class="status-line" id="vigStatusLine"></div>
    <div class="error-box" id="vigErrorBox"></div>
    <div class="result-box" id="vigResultBox"></div>
  </div>

  <footer>
    Made by Laevatain
  </footer>
  </div>
</div>

<script>
// Top-level tool switcher
const toolTabs = document.querySelectorAll('.tool-tab');
const toolPanels = document.querySelectorAll('.tool-panel');
toolTabs.forEach(tt => {
  tt.addEventListener('click', () => {
    toolTabs.forEach(t => t.classList.remove('active'));
    toolPanels.forEach(p => p.classList.remove('active'));
    tt.classList.add('active');
    document.getElementById('tool-' + tt.dataset.tool).classList.add('active');
  });
});

// PGP tool's password/key sub-tabs (scoped to the PGP panel only)
const tabs = document.querySelectorAll('#tool-pgp .tab');
const sections = document.querySelectorAll('.mode-section');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    sections.forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('mode-' + tab.dataset.mode).classList.add('active');
    hideMessages();
  });
});

function hideMessages() {
  document.getElementById('errorBox').style.display = 'none';
  document.getElementById('resultBox').style.display = 'none';
  document.getElementById('statusLine').textContent = '';
}

function normalizeArmor(raw) {
  let text = raw.trim();
  if (!text.includes('-----BEGIN PGP MESSAGE-----')) {
    text = '-----BEGIN PGP MESSAGE-----\n\n' + text + '\n-----END PGP MESSAGE-----';
  }
  return text;
}

document.getElementById('decryptBtn').addEventListener('click', async () => {
  hideMessages();
  const btn = document.getElementById('decryptBtn');
  const statusLine = document.getElementById('statusLine');
  const errorBox = document.getElementById('errorBox');
  const resultBox = document.getElementById('resultBox');
  const activeMode = document.querySelector('.tab.active').dataset.mode;

  const cipherRaw = document.getElementById('cipherInput').value;
  if (!cipherRaw.trim()) {
    errorBox.textContent = 'Lütfen şifreli mesajı yapıştır.';
    errorBox.style.display = 'block';
    return;
  }

  if (typeof openpgp === 'undefined') {
    errorBox.textContent = 'Kütüphane henüz yüklenmedi. Birkaç saniye bekleyip tekrar dene (internet bağlantını da kontrol et).';
    errorBox.style.display = 'block';
    return;
  }

  btn.disabled = true;
  statusLine.textContent = 'Ayrıştırılıyor...';

  try {
    const armored = normalizeArmor(cipherRaw);
    const message = await openpgp.readMessage({ armoredMessage: armored });

    let decrypted;
    if (activeMode === 'password') {
      const passphrase = document.getElementById('passInput').value;
      if (!passphrase) {
        throw new Error('Parola boş olamaz.');
      }
      statusLine.textContent = 'Parola ile çözülüyor...';
      decrypted = await openpgp.decrypt({
        message,
        passwords: [passphrase],
        format: 'utf8'
      });
    } else {
      const privKeyArmor = document.getElementById('privKeyInput').value.trim();
      const keyPass = document.getElementById('keyPassInput').value;
      if (!privKeyArmor) {
        throw new Error('Private key boş olamaz.');
      }
      statusLine.textContent = 'Key yükleniyor...';
      let privateKey = await openpgp.readPrivateKey({ armoredKey: privKeyArmor });
      if (!privateKey.isDecrypted() && keyPass) {
        privateKey = await openpgp.decryptKey({ privateKey, passphrase: keyPass });
      }
      statusLine.textContent = 'Private key ile çözülüyor...';
      decrypted = await openpgp.decrypt({
        message,
        decryptionKeys: privateKey,
        format: 'utf8'
      });
    }

    resultBox.textContent = decrypted.data;
    resultBox.style.display = 'block';
    statusLine.textContent = '✓ Başarıyla çözüldü';
  } catch (err) {
    errorBox.textContent = 'Hata: ' + (err.message || 'Çözülemedi. Parolayı/anahtarı ve mesaj formatını kontrol et.');
    errorBox.style.display = 'block';
    statusLine.textContent = '';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('cipherInput').addEventListener('input', hideMessages);
document.getElementById('passInput').addEventListener('input', hideMessages);
document.getElementById('privKeyInput').addEventListener('input', hideMessages);

// ---- Base64 + Vigenère tool ----
const vtabs = document.querySelectorAll('.vtab');
const vigInputLabel = document.getElementById('vigInputLabel');
const vigInputText = document.getElementById('vigInputText');

function hideVigMessages() {
  document.getElementById('vigErrorBox').style.display = 'none';
  document.getElementById('vigResultBox').style.display = 'none';
  document.getElementById('vigStatusLine').textContent = '';
}

vtabs.forEach(tab => {
  tab.addEventListener('click', () => {
    vtabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    hideVigMessages();
    if (tab.dataset.vmode === 'encode') {
      vigInputLabel.textContent = 'Metin (düz yazı)';
      vigInputText.placeholder = 'Şifrelenecek düz metni yaz';
    } else {
      vigInputLabel.textContent = 'Base64 Kod';
      vigInputText.placeholder = 'Çözülecek Base64 kodunu yapıştır';
    }
  });
});

function vigenereEncode(text, key) {
  key = key.toLowerCase().replace(/[^a-z]/g, '');
  if (!key) throw new Error('Anahtar kelime en az bir harf içermeli.');
  let result = '';
  let ki = 0;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const code = ch.toLowerCase().charCodeAt(0);
    if (code >= 97 && code <= 122) {
      const keyShift = key.charCodeAt(ki % key.length) - 97;
      const base = code - 97;
      const shifted = (base + keyShift) % 26;
      const outCh = String.fromCharCode(shifted + 97);
      result += (ch === ch.toUpperCase()) ? outCh.toUpperCase() : outCh;
      ki++;
    } else {
      result += ch;
    }
  }
  return result;
}

function vigenereDecode(text, key) {
  key = key.toLowerCase().replace(/[^a-z]/g, '');
  if (!key) throw new Error('Anahtar kelime en az bir harf içermeli.');
  let result = '';
  let ki = 0;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const code = ch.toLowerCase().charCodeAt(0);
    if (code >= 97 && code <= 122) {
      const keyShift = key.charCodeAt(ki % key.length) - 97;
      const base = code - 97;
      const shifted = ((base - keyShift) % 26 + 26) % 26;
      const outCh = String.fromCharCode(shifted + 97);
      result += (ch === ch.toUpperCase()) ? outCh.toUpperCase() : outCh;
      ki++;
    } else {
      result += ch;
    }
  }
  return result;
}

document.getElementById('vigRunBtn').addEventListener('click', () => {
  hideVigMessages();
  const errorBox = document.getElementById('vigErrorBox');
  const resultBox = document.getElementById('vigResultBox');
  const statusLine = document.getElementById('vigStatusLine');
  const mode = document.querySelector('.vtab.active').dataset.vmode;
  const key = document.getElementById('vigKeyInput').value.trim();
  const raw = vigInputText.value;

  if (!raw.trim()) {
    errorBox.textContent = 'Lütfen metni gir.';
    errorBox.style.display = 'block';
    return;
  }
  if (!key) {
    errorBox.textContent = 'Lütfen anahtar kelimeyi gir.';
    errorBox.style.display = 'block';
    return;
  }

  try {
    let output;
    if (mode === 'encode') {
      statusLine.textContent = 'Vigenère ile şifreleniyor...';
      const vig = vigenereEncode(raw, key);
      statusLine.textContent = 'Base64\'e çevriliyor...';
      output = btoa(unescape(encodeURIComponent(vig)));
    } else {
      statusLine.textContent = 'Base64 çözülüyor...';
      const b64decoded = decodeURIComponent(escape(atob(raw.trim())));
      statusLine.textContent = 'Vigenère ile çözülüyor...';
      output = vigenereDecode(b64decoded, key);
    }
    resultBox.textContent = output;
    resultBox.style.display = 'block';
    statusLine.textContent = '✓ Tamamlandı';
  } catch (err) {
    errorBox.textContent = 'Hata: ' + (err.message || 'İşlem başarısız. Girdiyi kontrol et.');
    errorBox.style.display = 'block';
    statusLine.textContent = '';
  }
});

vigInputText.addEventListener('input', hideVigMessages);
document.getElementById('vigKeyInput').addEventListener('input', hideVigMessages);
</script>
</body>
</html>
